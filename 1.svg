<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 및 가이드라인 -->
  <rect x="40" y="40" width="720" height="520" fill="none" stroke="#e5e5e5" stroke-width="1" />
  
  <!-- 제목 -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0a0a0a">데이터 표준화 및 구조화 과정</text>

  <!-- 영역 구분 레이블 -->
  <rect x="83" y="495" width="134" height="40" rx="5" fill="#f5f5f5" />
  <text x="150" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#737373">비표준 데이터</text>
  
  <rect x="339" y="495" width="122" height="40" rx="5" fill="#f5f5f5" />
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#737373">표준화 엔진</text>
  
  <rect x="559" y="495" width="182" height="40" rx="5" fill="#f5f5f5" />
  <text x="650" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#737373">안정적인 데이터 구조</text>

  <!-- 중앙 표준화 박스 -->
  <rect x="340" y="240" width="120" height="120" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="2s" repeatCount="indefinite" />
  </rect>
  <path d="M380 300 L420 300 M400 280 L400 320" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <!-- 데이터 유닛 1 -->
  <g>
    <path d="M-25,-15 L20,-25 L30,10 L-15,25 Z" fill="#737373" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="0s" />
    </path>
    <rect x="-42" y="-20" width="84" height="40" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="0s" />
    </rect>
    <animateMotion dur="5s" repeatCount="indefinite" begin="0s" path="M 150 300 L 400 300 L 400 300 L 602 460 L 602 460" keyTimes="0;0.3;0.4;0.7;1" />
  </g>

  <!-- 데이터 유닛 2 -->
  <g>
    <circle r="22" fill="#737373" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="1s" />
    </circle>
    <rect x="-42" y="-20" width="84" height="40" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="1s" />
    </rect>
    <animateMotion dur="5s" repeatCount="indefinite" begin="1s" path="M 100 350 L 400 300 L 400 300 L 690 460 L 690 460" keyTimes="0;0.3;0.4;0.7;1" />
  </g>

  <!-- 데이터 유닛 3 -->
  <g>
    <path d="M0,-25 L25,20 L-25,20 Z" fill="#737373" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="2s" />
    </path>
    <rect x="-42" y="-20" width="84" height="40" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="2s" />
    </rect>
    <animateMotion dur="5s" repeatCount="indefinite" begin="2s" path="M 150 400 L 400 300 L 400 300 L 646 418 L 646 418" keyTimes="0;0.3;0.4;0.7;1" />
  </g>

  <!-- 데이터 유닛 4 -->
  <g>
    <path d="M-20,-20 H20 V10 H0 V25 H-20 Z" fill="#737373" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="3s" />
    </path>
    <rect x="-42" y="-20" width="84" height="40" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="3s" />
    </rect>
    <animateMotion dur="5s" repeatCount="indefinite" begin="3s" path="M 100 250 L 400 300 L 400 300 L 602 376 L 602 376" keyTimes="0;0.3;0.4;0.7;1" />
  </g>

  <!-- 데이터 유닛 5 -->
  <g>
    <path d="M0,-25 L30,0 L0,25 L-30,0 Z" fill="#737373" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="4s" />
    </path>
    <rect x="-42" y="-20" width="84" height="40" fill="#2563eb" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.3;0.35;0.8;1" dur="5s" repeatCount="indefinite" begin="4s" />
    </rect>
    <animateMotion dur="5s" repeatCount="indefinite" begin="4s" path="M 200 350 L 400 300 L 400 300 L 690 376 L 690 376" keyTimes="0;0.3;0.4;0.7;1" />
  </g>

  <!-- 벽 가이드라인 (결과물 위치 강조) -->
  <rect x="555" y="350" width="185" height="135" fill="none" stroke="#e5e5e5" stroke-width="1" rx="5" />
</svg>