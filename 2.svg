<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 제목 -->
  <text x="400" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#0a0a0a">서버 자산 추적 및 관리 시스템</text>

  <!-- 네트워크 연결선 -->
  <g stroke="#e5e5e5" stroke-width="2">
    <line x1="200" y1="200" x2="600" y2="440">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="1s" fill="freeze" />
    </line>
    <line x1="600" y1="200" x2="200" y2="440">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="1s" fill="freeze" />
    </line>
    <line x1="400" y1="150" x2="400" y2="490">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="1s" fill="freeze" />
    </line>
    <line x1="150" y1="320" x2="650" y2="320">
      <animate attributeName="stroke-dasharray" from="0,1000" to="1000,0" dur="1s" fill="freeze" />
    </line>
  </g>

  <!-- 서버 네트워크 노드들 -->
  <g fill="white" stroke="#737373" stroke-width="2">
    <rect x="170" y="180" width="60" height="40" rx="4" />
    <rect x="370" y="130" width="60" height="40" rx="4" />
    <rect x="570" y="180" width="60" height="40" rx="4" />
    <rect x="170" y="300" width="60" height="40" rx="4" />
    <rect x="570" y="300" width="60" height="40" rx="4" />
    <rect x="170" y="420" width="60" height="40" rx="4" />
    <rect x="370" y="470" width="60" height="40" rx="4" />
    <rect x="570" y="420" width="60" height="40" rx="4" />
  </g>

  <!-- 타겟 서버 (강조) -->
  <g id="target-server" transform="translate(370, 300)">
    <rect width="60" height="40" rx="4" fill="white" stroke="#7c3aed" stroke-width="3">
      <animate attributeName="stroke-width" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </rect>
    <circle cx="15" cy="12" r="3" fill="#7c3aed" />
    <circle cx="15" cy="28" r="3" fill="#7c3aed" />
  </g>

  <!-- 돋보기 애니메이션 -->
  <g id="magnifier">
    <g stroke="#7c3aed" stroke-width="4" fill="none">
      <circle cx="0" cy="0" r="45" stroke-dasharray="282" stroke-dashoffset="282">
        <animate attributeName="stroke-dashoffset" from="282" to="0" begin="1s" dur="0.5s" fill="freeze" />
      </circle>
      <line x1="32" y1="32" x2="60" y2="60" stroke-linecap="round">
        <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.25s" fill="freeze" />
      </line>
    </g>
    <animateMotion path="M 100 100 L 400 320" begin="0.75s" dur="0.75s" fill="freeze" />
  </g>

  <!-- 디지털 장부 (Ledger) -->
  <g id="ledger" opacity="0" transform="translate(480, 240)">
    <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.5s" fill="freeze" />
    <rect width="220" height="160" rx="8" fill="white" stroke="#7c3aed" stroke-width="2" filter="drop-shadow(0 4 4 rgba(0,0,0,0.1))" />
    
    <!-- 장부 헤더 -->
    <rect width="220" height="35" rx="8" fill="#7c3aed" />
    <text x="110" y="20" text-anchor="middle" fill="white" font-size="14" font-weight="bold">디지털 자산 장부</text>
    
    <!-- 장부 내용 -->
    <g font-size="13" fill="#0a0a0a">
      <text x="20" y="65" text-anchor="start" opacity="0">
        프로그램: 보안 커널 v2.1
        <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.5s" fill="freeze" />
      </text>
      <text x="20" y="95" text-anchor="start" opacity="0">
        소유자: IT 인프라팀
        <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.5s" fill="freeze" />
      </text>
      <text x="20" y="125" text-anchor="start" opacity="0">
        수정일: 2023.10.24
        <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.5s" fill="freeze" />
      </text>
      <text x="20" y="145" text-anchor="start" font-size="11" fill="#059669" opacity="0">
        ● 무결성 검증 완료
        <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.5s" fill="freeze" />
      </text>
    </g>
  </g>

  <!-- 하단 설명 -->
  <text x="400" y="560" text-anchor="middle" font-size="16" fill="#737373">돋보기를 통해 특정 서버의 상세 자산 정보를 실시간으로 추적합니다.</text>
</svg>